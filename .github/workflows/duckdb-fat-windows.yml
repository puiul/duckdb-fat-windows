# Builds duckdb.exe for windows_amd64 with extensions statically linked.
# Runs only on manual trigger (Actions tab -> "Run workflow").
#
# Two variants:
#   chubby - for the Dell work laptop: ducklake, excel, httpfs, sqlite_scanner
#            on top of the in-tree set. Built with DISABLE_EXTENSION_LOAD, so
#            INSTALL/LOAD are refused and only the built-ins can ever run.
#   fat    - everything that builds for windows_amd64 at DuckDB 2.0 (vortex is
#            excluded upstream on WIN32; sqlsmith and test-utils are test
#            tools). Extension loading stays enabled, autoloading on,
#            autoinstall off.
name: duckdb-fat-windows

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "chubby (Dell laptop, locked) or fat (everything)"
        required: true
        type: choice
        options: [chubby, fat]
        default: chubby
      duckdb_ref:
        description: "DuckDB git tag to build (see https://github.com/duckdb/duckdb/releases)"
        required: true
        default: "v2.0.0"
      extensions:
        description: "Optional: semicolon-separated list overriding the variant's default (dependency order matters)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # for the provenance attestation
      attestations: write
    env:
      # Explicit folder so the cache action and vcpkg agree on the path
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
      # The EXE uses the static C runtime (x64-windows-static). Rust builds
      # default to the dynamic one; make the Rust-based extensions (delta,
      # unity_catalog, lance) match. Target-scoped, so build scripts are unaffected.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    # GitHub-hosted runners stop at 360 min. The steps below get their own
    # limits so a long cold vcpkg run still leaves time to save the cache.
    timeout-minutes: ${{ inputs.variant == 'fat' && 360 || 180 }}

    steps:
      # Extension order matters: an extension whose dependency is not linked
      # yet triggers autoload at startup, and then every invocation dies
      # (avro before iceberg, delta before unity_catalog, aws before glue).
      - name: Resolve variant
        shell: pwsh
        run: |
          $chubby = 'parquet;core_functions;autocomplete;icu;json;excel;httpfs;sqlite_scanner;ducklake'
          $fat = 'parquet;core_functions;autocomplete;icu;json;avro;excel;inet;fts;vss;encodings;spatial;legacy_parser;httpfs;quack;sqlite_scanner;postgres_scanner;mysql_scanner;odbc_scanner;aws;azure;iceberg;delta;unity_catalog;glue;lance;ducklake'
          $exts = "${{ inputs.extensions }}".Trim()
          if (-not $exts) { $exts = if ("${{ inputs.variant }}" -eq 'fat') { $fat } else { $chubby } }
          "EXTS=$exts" >> $env:GITHUB_ENV
          Write-Host "variant=${{ inputs.variant }} duckdb_ref=${{ inputs.duckdb_ref }}"
          Write-Host "extensions=$exts"

      - name: Check out DuckDB source at the requested tag
        uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: ${{ inputs.duckdb_ref }}
          fetch-depth: 0   # git describe needs the tags

      # duckdb-iceberg ships test data with paths beyond Windows' 260-char
      # default; git refuses to write them unless long paths are enabled.
      - name: Enable long paths for git
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Rust toolchain report
        if: inputs.variant == 'fat'
        shell: pwsh
        run: |
          rustup show
          cargo --version

      # vcpkg builds the dependencies from source; keep the compiled packages
      # between runs. Restore here, save at the end regardless of job outcome
      # (plain actions/cache only saves on success).
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ inputs.variant }}-${{ inputs.duckdb_ref }}-${{ hashFiles('.github/config/extensions/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ inputs.variant }}-${{ inputs.duckdb_ref }}-
            vcpkg-${{ runner.os }}-${{ inputs.variant }}-
            vcpkg-${{ runner.os }}-

      - name: Ensure vcpkg cache folder exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # DuckDB <= 1.5 marked some configs (fts, encodings, sqlite_scanner) with
      # DONT_LINK, which yields a loadable file instead of linking into the EXE.
      # None carry it at v2.0.0; this stays as a no-op guard for older refs.
      # Linked extensions also need INCLUDE_DIR so the generated loader can
      # find <name>_extension.hpp; fts's config still omits it at v2.0.0.
      - name: Strip DONT_LINK, add missing INCLUDE_DIR
        shell: pwsh
        run: |
          foreach ($ext in $env:EXTS.Split(';', [StringSplitOptions]::RemoveEmptyEntries)) {
            $cfg = ".github/config/extensions/$ext.cmake"
            if (-not (Test-Path $cfg)) { continue }   # in-tree extension
            $txt = Get-Content $cfg -Raw
            $orig = $txt
            if ($txt -match '\bDONT_LINK\b') {
              Write-Host "Stripping DONT_LINK from $cfg"
              $txt = $txt -replace '\bDONT_LINK\b', ''
            }
            if ($txt -notmatch 'INCLUDE_DIR' -and $ext -in @('fts')) {
              Write-Host "Adding INCLUDE_DIR src/include to $cfg"
              $txt = $txt -replace '(\s+)GIT_URL', '$1INCLUDE_DIR src/include$1GIT_URL'
            }
            if ($txt -ne $orig) { $txt | Set-Content -Path $cfg -NoNewline; Get-Content $cfg }
          }

      # Phase 1: DuckDB's "extension configuration" build. It resolves the
      # out-of-tree extensions (pinned per DuckDB release under
      # .github/config/extensions/) and merges their vcpkg.json manifests.
      - name: Merge extension vcpkg manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/extension_configuration | Out-Null
          Set-Location build/extension_configuration
          cmake -DEXTENSION_CONFIG_BUILD=TRUE `
                -DBUILD_EXTENSIONS="$env:EXTS" `
                -DBUILD_COMPLETE_EXTENSION_SET=${{ inputs.variant == 'fat' && 'TRUE' || 'FALSE' }} `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_GENERATOR_PLATFORM=x64 `
                ../..
          cmake --build . --config Release
          Get-ChildItem

      # Phase 2: real configure. vcpkg (preinstalled on the runner) installs the
      # merged dependencies in manifest mode; on a cold cache this is the long part.
      - name: Configure
        timeout-minutes: ${{ inputs.variant == 'fat' && 300 || 150 }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          Set-Location build/release
          $lock = @()
          if ("${{ inputs.variant }}" -eq 'chubby') { $lock = @('-DDISABLE_EXTENSION_LOAD=TRUE') }
          cmake -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_GENERATOR_PLATFORM=x64 `
                -DBUILD_SHELL=TRUE `
                -DBUILD_UNITTESTS=FALSE `
                -DBUILD_BENCHMARKS=FALSE `
                -DEXTENSION_STATIC_BUILD=TRUE `
                -DENABLE_EXTENSION_AUTOLOADING=1 `
                @lock `
                -DBUILD_COMPLETE_EXTENSION_SET=${{ inputs.variant == 'fat' && 'TRUE' || 'FALSE' }} `
                -DBUILD_EXTENSIONS="$env:EXTS" `
                -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/build/extension_configuration" `
                -DVCPKG_TARGET_TRIPLET=x64-windows-static `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
                ../..

      # The generated extension loader includes <name>_extension.hpp. List what
      # each extension ships and shim the expected name if it differs.
      - name: Inspect and shim extension headers
        shell: pwsh
        run: |
          foreach ($ext in $env:EXTS.Split(';', [StringSplitOptions]::RemoveEmptyEntries)) {
            $src = "build/release/_deps/${ext}_extension_fc-src"
            if (-not (Test-Path $src)) { continue }   # in-tree extension
            $inc = Join-Path $src "src/include"
            $want = Join-Path $inc "${ext}_extension.hpp"
            if (Test-Path $want) { Write-Host "== $ext: ${ext}_extension.hpp present"; continue }
            Write-Host "== $ext: no ${ext}_extension.hpp; headers found:"
            Get-ChildItem -Path $src -Recurse -Filter *extension*.hpp | ForEach-Object { "   " + $_.FullName }
            $alt = Get-ChildItem -Path $src -Recurse -Filter "${ext}-extension.hpp" | Select-Object -First 1
            if ($alt) {
              New-Item -ItemType Directory -Force $inc | Out-Null
              Set-Content -Path $want -Value "#pragma once`n#include `"$($alt.Name)`"`n"
              Write-Host "   shim written: ${ext}_extension.hpp -> $($alt.Name)"
            } else {
              Write-Host "   WARNING: link of $ext may fail"
            }
          }

      - name: Build the CLI
        timeout-minutes: ${{ inputs.variant == 'fat' && 300 || 150 }}
        shell: pwsh
        run: cmake --build build/release --config Release --target shell --parallel 4

      - name: Locate the binary and report on it
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/release -Recurse -Filter duckdb.exe | Select-Object -First 1
          if (-not $exe) { throw "duckdb.exe not found" }
          Write-Host "Binary: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/duckdb.exe

          Write-Host "`n== Loadable extension files DuckDB built (should be empty if all are linked):"
          if (Test-Path build/release/repository) {
            Get-ChildItem -Path build/release/repository -Recurse -Filter *.duckdb_extension | ForEach-Object { $_.FullName }
          } else { Write-Host "(no repository directory)" }

          Write-Host "`n== version"
          & dist/duckdb.exe --version
          Write-Host "`n== SELECT 1"
          & dist/duckdb.exe -c "SELECT 1"
          Write-Host "`n== loaded extensions"
          & dist/duckdb.exe -c "SELECT extension_name, install_mode FROM duckdb_extensions() WHERE loaded ORDER BY extension_name"

      # Inputs for a Black Duck / SCA review: vcpkg's per-port SPDX files,
      # the pinned commit of every out-of-tree extension, and the Cargo.lock
      # of each Rust-based extension.
      - name: Collect SBOM inputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sbom/vcpkg | Out-Null
          $share = "build/release/vcpkg_installed/x64-windows-static/share"
          if (Test-Path $share) {
            Get-ChildItem $share -Directory | ForEach-Object {
              $f = Join-Path $_.FullName 'vcpkg.spdx.json'
              if (Test-Path $f) { Copy-Item $f "sbom/vcpkg/$($_.Name).spdx.json" }
            }
          }
          $pins = foreach ($ext in $env:EXTS.Split(';', [StringSplitOptions]::RemoveEmptyEntries)) {
            $cfg = ".github/config/extensions/$ext.cmake"
            if (Test-Path $cfg) {
              $t = Get-Content $cfg -Raw
              $url = [regex]::Match($t, 'GIT_URL\s+(\S+)').Groups[1].Value
              $tag = [regex]::Match($t, 'GIT_TAG\s+(\S+)').Groups[1].Value
              "$ext`t$url`t$tag"
            } else { "$ext`tin-tree`t${{ inputs.duckdb_ref }}" }
          }
          "extension`tgit_url`tgit_tag" , $pins | Set-Content sbom/extension-pins.tsv
          Get-ChildItem build/release/_deps -Recurse -Filter Cargo.lock -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\target\\|\\cargo\\registry\\' } |
            ForEach-Object { $n = ($_.FullName -replace '^.*\\_deps\\','' -replace '[\\/]','_'); Copy-Item $_.FullName "sbom/$n" }
          Get-ChildItem -Recurse sbom | ForEach-Object { $_.FullName }

      - name: Disk usage
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Save vcpkg binary packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Upload duckdb.exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-windows-amd64-${{ inputs.variant }}-${{ inputs.duckdb_ref }}
          path: dist/duckdb.exe
          if-no-files-found: error

      - name: Upload SBOM inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.variant }}-${{ inputs.duckdb_ref }}
          path: sbom
          if-no-files-found: warn

      # Signed provenance (SLSA) linking the EXE to this repo, commit and run.
      # Verify later with: gh attestation verify duckdb.exe --owner <github user>
      - name: Attest build provenance
        if: success()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/duckdb.exe
