# Builds duckdb.exe for windows_amd64 with the listed extensions statically linked.
# Runs only on manual trigger (Actions tab -> "Run workflow").
name: duckdb-fat-windows

on:
  workflow_dispatch:
    inputs:
      duckdb_ref:
        description: "DuckDB git tag to build (see https://github.com/duckdb/duckdb/releases)"
        required: true
        default: "v1.5.5"
      extensions:
        description: "Semicolon-separated extension list to link in"
        required: true
        default: "autocomplete;icu;json;excel;httpfs;iceberg;sqlite_scanner;ducklake;encodings;fts;inet"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out DuckDB source at the requested tag
        uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: ${{ inputs.duckdb_ref }}
          fetch-depth: 0   # git describe needs the tags

      # duckdb-iceberg ships test data with paths beyond Windows' 260-char
      # default; git refuses to write them unless long paths are enabled.
      - name: Enable long paths for git
        shell: pwsh
        run: git config --system core.longpaths true

      # vcpkg builds the AWS SDK and OpenSSL from source (~20 min); keep the
      # compiled packages between runs. Restore here, save at the end
      # regardless of job outcome (plain actions/cache only saves on success).
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ inputs.duckdb_ref }}-${{ hashFiles('.github/config/extensions/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ inputs.duckdb_ref }}-
            vcpkg-${{ runner.os }}-

      # Some of DuckDB's per-extension configs (fts, encodings, sqlite_scanner on
      # Windows at v1.5.5) carry DONT_LINK, which yields a loadable file instead
      # of linking into the EXE. DuckDB includes these files directly, so strip
      # the flag in place. Linked extensions also need INCLUDE_DIR so the
      # generated loader can find <name>_extension.hpp; DONT_LINK configs omit it.
      # Note: sqlite_scanner's file says static linking on Windows has symbol
      # collisions; if the link fails, drop it from the list.
      - name: Strip DONT_LINK from extension configs
        shell: pwsh
        run: |
          foreach ($ext in "${{ inputs.extensions }}".Split(';', [StringSplitOptions]::RemoveEmptyEntries)) {
            $cfg = ".github/config/extensions/$ext.cmake"
            if ((Test-Path $cfg) -and (Select-String -Path $cfg -Pattern 'DONT_LINK' -Quiet)) {
              Write-Host "Stripping DONT_LINK from $cfg"
              $txt = (Get-Content $cfg -Raw) -replace '\bDONT_LINK\b', ''
              if ($txt -notmatch 'INCLUDE_DIR') {
                $txt = $txt -replace '(\s+)GIT_URL', '$1INCLUDE_DIR src/include$1GIT_URL'
              }
              $txt | Set-Content -Path $cfg -NoNewline
              Get-Content $cfg
            }
          }

      # Phase 1: DuckDB's "extension configuration" build. It resolves the
      # out-of-tree extensions (excel, httpfs, iceberg live in their own repos,
      # pinned per DuckDB release under .github/config/extensions/) and merges
      # their vcpkg.json dependency manifests into one.
      - name: Merge extension vcpkg manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/extension_configuration | Out-Null
          Set-Location build/extension_configuration
          cmake -DEXTENSION_CONFIG_BUILD=TRUE `
                -DBUILD_EXTENSIONS="${{ inputs.extensions }}" `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_GENERATOR_PLATFORM=x64 `
                ../..
          cmake --build . --config Release
          Get-ChildItem

      # Phase 2: real configure. vcpkg (preinstalled on the runner) installs the
      # merged dependencies (OpenSSL for httpfs, AWS SDK for iceberg, etc.) in
      # manifest mode.
      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          Set-Location build/release
          cmake -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_GENERATOR_PLATFORM=x64 `
                -DBUILD_SHELL=TRUE `
                -DBUILD_UNITTESTS=FALSE `
                -DBUILD_BENCHMARKS=FALSE `
                -DEXTENSION_STATIC_BUILD=TRUE `
                -DBUILD_EXTENSIONS="${{ inputs.extensions }}" `
                -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/build/extension_configuration" `
                -DVCPKG_TARGET_TRIPLET=x64-windows-static `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
                ../..

      - name: Build the CLI
        shell: pwsh
        run: cmake --build build/release --config Release --target shell --parallel 4

      - name: Locate the binary and report on it
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/release -Recurse -Filter duckdb.exe | Select-Object -First 1
          if (-not $exe) { throw "duckdb.exe not found" }
          Write-Host "Binary: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/duckdb.exe

          Write-Host "`n== Loadable extension files DuckDB built (should be empty if all are linked):"
          if (Test-Path build/release/repository) {
            Get-ChildItem -Path build/release/repository -Recurse -Filter *.duckdb_extension | ForEach-Object { $_.FullName }
          } else { Write-Host "(no repository directory)" }

          Write-Host "`n== version"
          & dist/duckdb.exe --version
          Write-Host "`n== SELECT 1"
          & dist/duckdb.exe -c "SELECT 1"
          Write-Host "`n== extension status"
          & dist/duckdb.exe -c "SELECT extension_name, loaded, installed, install_mode FROM duckdb_extensions() WHERE extension_name IN ('parquet','core_functions','autocomplete','icu','json','excel','httpfs','iceberg','sqlite_scanner','ducklake','encodings','fts','inet') ORDER BY extension_name"
          Write-Host "`n== loaded extensions"
          & dist/duckdb.exe -c "SELECT extension_name, install_mode FROM duckdb_extensions() WHERE loaded ORDER BY extension_name"

      - name: Save vcpkg binary packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Upload duckdb.exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-windows-amd64-static-${{ inputs.duckdb_ref }}
          path: dist/duckdb.exe
          if-no-files-found: error
